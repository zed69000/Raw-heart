# Builds an installable Android APK of the web game (public/) wrapped with Capacitor.
# The Android project is generated on each build, so nothing Android-specific is kept in the repo.
workflows:
  android-apk:
    name: Raw Heart Android (APK)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: android-app
    environment:
      node: 20
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Capacitor
        script: npm install
      - name: Generate the Android project
        script: |
          npx cap add android
          # landscape only, full screen, screen kept on while playing
          perl -0pi -e 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's#(<style name="AppTheme.NoActionBar"[^>]*>)#$1\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Build the APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
