# Builds an installable Android APK of the web game (public/) wrapped with Capacitor.
# The Android project is generated on each build; only the overrides in android-app/native are kept in the repo.
workflows:
  android-apk:
    name: Raw Heart Android (APK)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: android-app
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Capacitor
        script: npm install
      - name: Generate the Android project (web files with Three.js bundled, landscape, full screen, icon)
        script: bash prepare.sh
      - name: Build the APK
        script: |
          # same debug key on every build, so a new APK installs over the previous one
          mkdir -p ~/.android && cp native/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
